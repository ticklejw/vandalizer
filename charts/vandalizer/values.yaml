# Default values for the vandalizer chart.
#
# The defaults mirror compose.yaml as closely as Kubernetes allows, with
# restricted-Pod-Security-compliant securityContexts. Values you MUST set
# for a working install:
#   config.frontendUrl
#   secrets.jwtSecretKey and secrets.configEncryptionKey (or secrets.existingSecret)
#   bootstrap.adminEmail / bootstrap.adminPassword (or disable bootstrap)
# and a ReadWriteMany-capable storage class for `uploads` (or an existingClaim).

image:
  backend:
    repository: ghcr.io/ui-insight/vandalizer-backend
    # Defaults to the chart appVersion when empty.
    tag: ""
  frontend:
    # The unprivileged variant (non-root nginx on 8080) is the default so the
    # chart works under the restricted Pod Security Standard and on OpenShift.
    # To use the root-nginx port-80 image Docker users get, see
    # values-frontend-root.yaml at the chart root.
    repository: ghcr.io/ui-insight/vandalizer-frontend-unprivileged
    tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Extra labels added to every rendered resource.
commonLabels: {}

config:
  # development | staging | production. Outside "development" the backend
  # refuses to start with a default JWT_SECRET_KEY.
  environment: production
  # Public URL users reach the app at, e.g. https://vandalizer.example.edu.
  # Required — feeds CORS and cookie-security decisions in the backend.
  frontendUrl: ""
  # Where uploaded files live inside backend pods; the uploads volume is
  # mounted here on the api, every celery worker, beat, and the bootstrap job.
  uploadDir: /app/static/uploads
  # Uvicorn workers per api pod. Prefer scaling api.replicaCount for HA;
  # raise this for per-pod throughput.
  webWorkers: 2
  # Arbitrary additional non-secret environment variables for the backend
  # (api + celery + bootstrap), e.g. GRAPH_NOTIFICATION_URL,
  # VANDALIZER_BASE_URL, SMTP settings, LOG_FORMAT. Keys are used verbatim.
  extraEnv: {}

secrets:
  # Name of a pre-existing Secret to use instead of the chart-managed one.
  # It is injected via envFrom, so its keys must be the environment variable
  # names themselves: JWT_SECRET_KEY, CONFIG_ENCRYPTION_KEY, and optionally
  # SMTP_PASSWORD, RESEND_API_KEY, SENTRY_DSN, GRAPH_TOKEN_KEY,
  # GRAPH_CLIENT_STATE_SECRET, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
  # AZURE_TENANT_ID. When set, every value below is ignored and no Secret is
  # rendered.
  existingSecret: ""
  # Session-signing key. Required (generate with `openssl rand -hex 32`).
  jwtSecretKey: ""
  # Fernet key encrypting LLM API keys and OAuth secrets stored in MongoDB.
  # Required. Generate once with:
  #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  # BACK IT UP — losing or rotating it makes every stored credential
  # undecryptable.
  configEncryptionKey: ""
  smtpPassword: ""
  resendApiKey: ""
  sentryDsn: ""
  # Microsoft 365 / Graph integration (all optional).
  azure:
    clientId: ""
    clientSecret: ""
    tenantId: ""
  graph:
    tokenKey: ""
    clientStateSecret: ""

# Shared uploads volume, mounted at config.uploadDir on the api and every
# celery pod. MUST be ReadWriteMany on multi-node clusters (api and workers
# are separate pods); any RWX-capable storage class works (Ceph NFS, EFS,
# Azure Files, ...). Single-node clusters can use ReadWriteOnce.
uploads:
  # Use a PVC you manage yourself instead of chart-created one.
  existingClaim: ""
  # "" = cluster default storage class, "-" = storageClassName: "" (none).
  storageClass: ""
  accessModes:
    - ReadWriteMany
  size: 50Gi
  annotations:
    # Keep uploaded documents when the release is uninstalled.
    helm.sh/resource-policy: keep

api:
  replicaCount: 1
  # Streaming chat/workflow responses (SSE) are served in-process; scaling
  # beyond 1 replica works for normal traffic but has had less soak time.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 8Gi
  podSecurityContext:
    runAsNonRoot: true
    # Makes the uploads volume writable by the image's appuser (uid 1000).
    # OpenShift: set to null (the SCC supplies supplemental groups).
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: {}
  extraVolumes: []
  extraVolumeMounts: []
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 75
  pdb:
    enabled: false
    minAvailable: 1

celery:
  # Longer than the app's task_time_limit (3660s) so a terminating worker can
  # finish in-flight tasks instead of losing them.
  terminationGracePeriodSeconds: 3720
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: {}
  extraVolumes: []
  extraVolumeMounts: []
  # One Deployment per key. Each entry accepts: concurrency (required),
  # replicas, resources, nodeSelector, tolerations, affinity, extraEnv.
  queues:
    documents:
      concurrency: 8
      replicas: 1
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 4Gi
    workflows:
      concurrency: 6
      replicas: 1
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 4Gi
    uploads:
      concurrency: 4
      replicas: 1
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 2Gi
    passive:
      concurrency: 2
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi
    default:
      concurrency: 2
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi

beat:
  # The Celery scheduler. Always exactly one replica — running two double-fires
  # every scheduled task.
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  replicaCount: 1
  # Must match the listen port of the chosen frontend image: 8080 for the
  # default unprivileged image, 80 for the root variant.
  containerPort: 8080
  service:
    type: ClusterIP
    port: 8080
  # Templated into the nginx config (see configmap-frontend-nginx.yaml).
  clientMaxBodySize: 200M
  # Applies to proxied /api requests; SSE streams need it generous.
  proxyReadTimeout: 300s
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  pdb:
    enabled: false
    minAvailable: 1

mongodb:
  # Render an in-cluster single-replica MongoDB. Set false and fill
  # external.uri to use an existing server.
  enabled: true
  image:
    repository: docker.io/library/mongo
    tag: 7.0.16
  external:
    # Full connection URI, e.g. mongodb://user:pass@mongo.example.edu:27017/
    # Used only when enabled=false.
    uri: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi
  podSecurityContext:
    runAsNonRoot: true
    # uid/gid of the mongodb user in the official image.
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  nodeSelector: {}
  tolerations: []
  affinity: {}
  persistence:
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    annotations:
      helm.sh/resource-policy: keep

redis:
  # Celery broker + cache. The application hardcodes redis://<host>:6379 with
  # no auth or TLS, so in-cluster Redis is unauthenticated (compensated by the
  # NetworkPolicy) and an external server must also answer unauthenticated on
  # 6379.
  enabled: true
  image:
    repository: docker.io/library/redis
    tag: 7.4-alpine
  external:
    # Hostname only (no port, no scheme). Used only when enabled=false.
    host: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  podSecurityContext:
    runAsNonRoot: true
    # uid/gid of the redis user in the official image.
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  nodeSelector: {}
  tolerations: []
  affinity: {}
  persistence:
    # Off by default (compose parity): the broker holds only queued tasks and
    # short-lived results; a restart loses queued-but-unstarted tasks.
    enabled: false
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    annotations: {}

chromadb:
  # Vector store for RAG. The app requires a network Chroma server in
  # Kubernetes (its embedded fallback is not multi-process safe). Keep the
  # image pinned: the backend speaks the v1 API (client chromadb 0.5.x);
  # Chroma >=1.0 servers are v2-only and will not work.
  enabled: true
  image:
    repository: docker.io/chromadb/chroma
    tag: 0.6.3
  external:
    # Used only when enabled=false. Rendered as host:port — CHROMADB_HOST is
    # not a URL.
    host: ""
    port: 8000
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  nodeSelector: {}
  tolerations: []
  affinity: {}
  persistence:
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    annotations:
      helm.sh/resource-policy: keep

# --- Edge routing -----------------------------------------------------------
# Default topology: ALL traffic (including /api) goes to the frontend Service;
# its nginx proxies /api to the api Service with the SSE, body-size, and OAuth
# callback behaviors the app depends on. Enable exactly one of ingress or
# httpRoute (both simultaneously is allowed for migrations). With both off,
# reach the app via port-forward (see NOTES.txt).

ingress:
  enabled: false
  className: ""
  # e.g. vandalizer.example.edu
  host: ""
  annotations: {}
  # - secretName: vandalizer-tls
  #   hosts: [vandalizer.example.edu]
  tls: []

httpRoute:
  enabled: false
  # parentRefs of the Gateway to attach to, e.g.
  # - name: campus-gateway
  #   namespace: gateways
  #   sectionName: https
  parentRefs: []
  # e.g. [vandalizer.example.edu]
  hostnames: []
  annotations: {}
  # SSE streams are long-lived; "0s" disables the request timeout where the
  # Gateway implementation supports it. Set a duration if yours rejects 0s.
  timeouts:
    request: 0s
  # Extra HTTPRouteRule entries appended verbatim before the default
  # catch-all rule — see values-split-routing.yaml for routing /api at the
  # edge instead of through the frontend nginx.
  additionalRules: []

# Compensating control for the unauthenticated in-cluster datastores:
# default-denies their ingress except from this release's backend pods, and
# restricts api ingress to the frontend (plus monitoring when the
# ServiceMonitor is enabled).
networkPolicy:
  enabled: true
  # By default only this release's frontend pods may reach the api. Add
  # namespace labels here to also admit traffic from other namespaces —
  # needed for split-edge routing (a Gateway sending /api straight to the api
  # Service) or Prometheus scraping /api/metrics, e.g.
  # {kubernetes.io/metadata.name: gateway-system}. The frontend itself is
  # left unrestricted (no policy selects it) so any edge can reach it.
  ingressNamespaceSelector: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

# One-time install bootstrap: creates the admin account, default team, and
# seeds the workflow catalog. Runs as a post-install hook Job ONLY — re-running
# it resets the admin password, so upgrades never trigger it. To re-run
# deliberately, see NOTES.txt.
bootstrap:
  enabled: true
  adminEmail: ""
  adminPassword: ""
  adminName: ""
  defaultTeamName: ""
  orgName: ""
  # Pre-existing Secret with keys ADMIN_EMAIL, ADMIN_PASSWORD (and optionally
  # ADMIN_NAME, DEFAULT_TEAM_NAME, ORG_NAME). Overrides the values above.
  existingSecret: ""

metrics:
  serviceMonitor:
    # Scrapes the backend's /api/metrics (NOTE: the endpoint is
    # unauthenticated). Requires the Prometheus Operator CRDs.
    enabled: false
    interval: 30s
    labels: {}
